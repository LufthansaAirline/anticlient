# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploys this whole site (static pages + the account/admin API in
# server/server.mjs) as one web service. In the Render dashboard:
# New -> Blueprint -> pick this repo -> Render reads this file automatically.
#
# Running on the FREE plan right now: no persistent disk, so data.json
# (every account, HWID, key, blacklist/whitelist entry) resets to empty
# whenever the service redeploys or restarts — which free services also do
# automatically after periods of inactivity. Fine for trying this out; risky
# once real customers have accounts. To add a persistent disk later: set
# `plan: starter` (or similar paid tier), add
#   disk:
#     name: anticlient-data
#     mountPath: /var/data
#     sizeGB: 1
# and an env var DATA_DIR=/var/data — then push; Render will ask for payment
# details on the next deploy since disks need a paid instance.
#
# ANTI_SIGNING_KEY_PEM: marked sync:false below, so Render prompts for its
# value during setup instead of storing it in this file / in git. Paste in
# the exact contents of the signing_key.pem that matches the public key
# already baked into the distributed mod jar — otherwise keys minted here
# won't verify for anyone. Render encrypts it; it's never written back here.

services:
  - type: web
    name: anticlient-site
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server/server.mjs
    autoDeploy: true
    envVars:
      - key: ANTI_SIGNING_KEY_PEM
        sync: false
